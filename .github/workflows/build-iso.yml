name: Build ISO

# Builds the bootable CyberDistro ISO(s) with live-build, inside a PRIVILEGED
# Debian trixie container (live-build needs root + chroot/mount/loop).
#
# Two language editions are built in parallel (Italian and English): each is a
# full ISO with its own UI language, locale and keyboard. They are published as
# TWO assets in a single GitHub Release (previous releases are never touched).
#
# Triggers:
#   * workflow_dispatch — manual, with options (which languages, Tor version…).
#   * push of a tag matching v* — builds and attaches to a GitHub Release.
#
# Honest notes:
#   * Long job (tens of minutes) needing lots of disk; we free the runner first.
#   * Needs network to deb.debian.org, http.kali.org, dist.torproject.org.
#   * GitHub Release assets are capped at 2 GiB each. A larger ISO is still
#     uploaded as a workflow ARTIFACT and the Release notes say so.

on:
  workflow_dispatch:
    inputs:
      full_build:
        description: "Full ISO build (false = validate live-build config only)"
        type: boolean
        default: true
      tbb_version:
        description: "Tor Browser version to bundle"
        type: string
        default: "15.0.26"
      languages:
        description: "Which language editions to build"
        type: choice
        options: [both, it, en]
        default: both
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create a Release on tags

concurrency:
  group: build-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ config
  prepare:
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.pick.outputs.langs }}
    steps:
      - id: pick
        run: |
          L='["it","en"]'
          case "${{ github.event.inputs.languages }}" in
            it) L='["it"]' ;;
            en) L='["en"]' ;;
          esac
          echo "langs=$L" >> "$GITHUB_OUTPUT"
          echo "Building languages: $L"

  validate-only:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate live-build config only
        run: |
          docker run --rm --privileged -v "$GITHUB_WORKSPACE":/work -w /work/build \
            -e CYBERDISTRO_EDITION_LANG=it \
            debian:trixie bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends live-build
              lb config
              ls -la config/
            '
          echo "Config-only validation passed. No ISO built (full_build=false)."

  # ------------------------------------------------------------------- build
  build:
    needs: prepare
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.full_build != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.prepare.outputs.langs) }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf \
            /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache \
            "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo docker image prune -af || true
          echo "After:"; df -h / | tail -1

      - name: Build ${{ matrix.lang }} ISO (privileged Debian container)
        env:
          TBB_VERSION: ${{ github.event.inputs.tbb_version || '15.0.26' }}
          LANG_EDITION: ${{ matrix.lang }}
        run: |
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE":/work -w /work \
            -e TBB_VERSION="$TBB_VERSION" \
            -e CYBERDISTRO_MULTILANG=1 \
            -e CYBERDISTRO_EDITION_LANG="$LANG_EDITION" \
            debian:trixie bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso squashfs-tools mtools dosfstools \
                grub-pc-bin grub-efi-amd64-bin python3 python3-pip \
                wget gnupg ca-certificates sudo procps xz-utils libcap2-bin
              cd build
              ./build.sh
            '

      - name: Normalize file ownership
        if: always()
        run: sudo chown -R "$USER" "$GITHUB_WORKSPACE" || true

      - name: Checksum + SBOM
        run: |
          ISO_NAME="CyberDistro-PC-x86_64-${{ matrix.lang }}.iso"
          test -f "iso/$ISO_NAME" || { echo "missing iso/$ISO_NAME"; ls -lh iso/ || true; exit 1; }
          ( cd iso && sha256sum "$ISO_NAME" > "$ISO_NAME.sha256" )
          python3 sbom/generate-sbom.py > sbom/cyberdistro.cdx.json
          echo "---- ${{ matrix.lang }} artifacts ----"; ls -lh iso/

      - name: Upload ${{ matrix.lang }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberdistro-iso-${{ matrix.lang }}
          path: |
            iso/CyberDistro-PC-x86_64-${{ matrix.lang }}.iso
            iso/CyberDistro-PC-x86_64-${{ matrix.lang }}.iso.sha256
            sbom/cyberdistro.cdx.json
          retention-days: 14
          if-no-files-found: error

  # ----------------------------------------------------------------- publish
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.full_build != 'false')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download all language artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: cyberdistro-iso-*
          merge-multiple: true

      - name: Compose release notes + asset list
        id: notes
        run: |
          VER="$(cat VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v${VER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          LIMIT=$((2*1024*1024*1024))
          NOTES="RELEASE-NOTES.md"
          {
            echo "# CyberDistro ${TAG}"
            echo
            echo "PC Edition (x86-64), avvio live da USB (UEFI + BIOS), in **due lingue**."
            echo "Scarica la ISO della tua lingua **e** il relativo file \`.sha256\`, poi verifica:"
            echo '```'
            echo "sha256sum -c <file>.iso.sha256   # atteso: ... OK"
            echo '```'
            echo
          } > "$NOTES"
          : > assets.txt
          for lang in it en; do
            ISO="dist/iso/CyberDistro-PC-x86_64-${lang}.iso"
            SUM="dist/iso/CyberDistro-PC-x86_64-${lang}.iso.sha256"
            [ -f "$ISO" ] || continue
            SIZE=$(stat -c%s "$ISO"); HASH=$(awk '{print $1}' "$SUM")
            NAME_IT=$( [ "$lang" = it ] && echo "Italiano" || echo "Inglese" )
            {
              echo "## ${NAME_IT} — \`CyberDistro-PC-x86_64-${lang}.iso\`"
              echo "- Dimensione: ${SIZE} byte"
              echo "- SHA-256: \`${HASH}\`"
              echo
            } >> "$NOTES"
            echo "$SUM" >> assets.txt
            if [ "$SIZE" -le "$LIMIT" ]; then
              echo "$ISO" >> assets.txt
            else
              echo "::warning::${ISO} exceeds 2 GiB; attaching checksum only, ISO stays as workflow artifact."
              echo ">⚠️ La ISO ${lang} supera 2 GiB: è disponibile come **artifact** del workflow \`cyberdistro-iso-${lang}\`." >> "$NOTES"
            fi
          done
          # one SBOM (packages are identical across editions)
          if [ -f dist/sbom/cyberdistro.cdx.json ]; then
            cp dist/sbom/cyberdistro.cdx.json cyberdistro.cdx.json
            echo "cyberdistro.cdx.json" >> assets.txt
          fi
          {
            echo "Release **ALPHA**. Novità 0.4.0: modalità guidata «Monitor di rete (bridge"
            echo "trasparente)» nel Security Center ed edizioni separate Italiano/Inglese."
          } >> "$NOTES"
          echo "Assets:"; cat assets.txt
          test -s assets.txt || { echo "::error::no assets resolved (check dist/ layout)"; find dist -maxdepth 3 -type f; exit 1; }

      - name: Create/update release with both ISOs
        run: |
          TAG="${{ steps.notes.outputs.tag }}"
          mapfile -t ASSETS < assets.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists: updating assets + notes"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" --notes-file RELEASE-NOTES.md --prerelease
          else
            if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git config user.name  "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "CyberDistro $TAG" "$GITHUB_SHA"
              git push origin "refs/tags/$TAG"
            fi
            python3 - "$TAG" RELEASE-NOTES.md > release.json <<'PY'
          import json, sys
          tag, notes = sys.argv[1], open(sys.argv[2], encoding="utf-8").read()
          print(json.dumps({"tag_name": tag, "name": f"CyberDistro {tag}",
                            "prerelease": True, "draft": False, "body": notes}))
          PY
            if ! RESP="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" --input release.json 2>&1)"; then
              echo "::error::Release creation failed:"; echo "$RESP"; exit 1
            fi
            echo "Created: $(echo "$RESP" | python3 -c 'import json,sys;print(json.load(sys.stdin)["html_url"])')"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets \
            --jq '{tag:.tagName,prerelease:.isPrerelease,assets:[.assets[].name]}'
