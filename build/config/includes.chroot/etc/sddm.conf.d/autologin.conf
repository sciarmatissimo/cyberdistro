# CyberDistro — autologin for the live session.
# Without this, SDDM stops at "select your user and enter password" on a live
# boot. We log the live user in automatically and default to the Plasma X11
# session (most compatible across hardware for a first boot; the user can still
# pick Plasma (Wayland) after logging out).
[Autologin]
User=analyst
Session=plasmax11.desktop
Relogin=false

[General]
# Prefer X11 greeter too, for broad hardware compatibility on first boot.
# (Autologin above normally bypasses the greeter entirely.)
