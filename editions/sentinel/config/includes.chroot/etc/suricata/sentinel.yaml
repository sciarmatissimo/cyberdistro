%YAML 1.1
---
include: /etc/suricata/suricata.yaml

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            tagged-packets: no
        - stats:
            totals: yes
            threads: no
stats:
  enabled: yes
  interval: 30
